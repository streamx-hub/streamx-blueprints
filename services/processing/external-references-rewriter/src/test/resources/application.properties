mp.messaging.incoming.incoming-resources.connector=smallrye-in-memory
mp.messaging.outgoing.outgoing-resources.connector=smallrye-in-memory
mp.messaging.outgoing.download-requests.connector=smallrye-in-memory

quarkus.http.test-port=0

streamx.blueprints.external-references-rewriter.base-url-for-relative-paths=https://www.my-eds-server.com/
streamx.blueprints.external-references-rewriter.processable-payload-types=page/blog,page/blog/external,web-resource/static,product/simple
streamx.blueprints.external-references-rewriter.html-external-resource-xpath-selectors=//img/@src,//link[@rel='stylesheet']/@href,//script/@src,//picture/source/@srcset
streamx.blueprints.external-references-rewriter.html-external-resource-url-exclusions-pattern=.*/(blocks/|fonts/|icons/|scripts/|styles/|helix-query.yaml).*
streamx.blueprints.external-references-rewriter.xml-external-resource-xpath-selectors=/*[local-name()='urlset']/*[local-name()='url']/*[local-name()='loc']
streamx.blueprints.external-references-rewriter.json-external-resource-jsonpath-selectors=$.data[*].image,$..attributes[?(@.name=='small_image' || @.name=='thumbnail')].values.*.value,$..attributes[?(@.name=='small_image' || @.name=='thumbnail')].values.*.label,$..primaryImage.url,$..gallery.*.url,$.productUrls[*],$.productRelativeUrls[*]
streamx.blueprints.external-references-rewriter.emitted-page-type=page/blog/external
streamx.blueprints.external-references-rewriter.emitted-web-resource-type=web-resource/static/external
streamx.blueprints.external-references-rewriter.emitted-asset-type=asset/static/external
streamx.blueprints.external-references-rewriter.external-resource-download-timeout-milliseconds=5000

quarkus.log.category."com.streamx.blueprints.rewriter".min-level=TRACE
quarkus.log.category."com.streamx.blueprints.rewriter".level=TRACE
quarkus.http.test-port=0

mp.messaging.incoming.incoming-assets.connector=smallrye-in-memory
mp.messaging.outgoing.optimized-assets.connector=smallrye-in-memory
mp.messaging.incoming.incoming-pages.connector=smallrye-in-memory
mp.messaging.outgoing.outgoing-pages.connector=smallrye-in-memory

quarkus.pulsar.devservices.enabled=false

quasar.messaging.store.incoming-assets_store-string.use-connector=false

streamx.blueprints.image-optimizer.optimized-file-paths-pattern=.*/images/.*\\.(png|gif|jpg|jpeg)$
streamx.blueprints.image-optimizer.optimized-image-file-name-suffix=-optimized
streamx.blueprints.image-optimizer.adjusted-page-paths-pattern=/pages/.*
streamx.blueprints.image-optimizer.webp-conversion-speed=6
streamx.blueprints.image-optimizer.webp-conversion-quality=75
streamx.blueprints.image-optimizer.webp-conversion-method=4
streamx.blueprints.image-optimizer.webp-conversion-lossless=false
streamx.blueprints.image-optimizer.webp-conversion-no-alpha=false
streamx.blueprints.image-optimizer.webp-conversion-multi-thread=false

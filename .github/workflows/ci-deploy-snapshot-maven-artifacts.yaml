name: 'CI: Deploy SNAPSHOT Maven Artifacts'

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'

permissions:
  id-token: write
  packages: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'adopt'
          cache: 'maven'

      - name: Build and deploy artifacts
        run: ./mvnw clean deploy -Dnative
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

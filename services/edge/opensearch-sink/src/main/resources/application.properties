mp.messaging.incoming.indexable-resources.connector=quarkus-http
mp.messaging.incoming.indexable-resources.deserializer=com.streamx.reactive.messaging.http.CloudEventJsonDeserializer
mp.messaging.incoming.indexable-resources.path=/indexable-resources

mp.messaging.incoming.indexable-resource-fragments.connector=quarkus-http
mp.messaging.incoming.indexable-resource-fragments.deserializer=com.streamx.reactive.messaging.http.CloudEventJsonDeserializer
mp.messaging.incoming.indexable-resource-fragments.path=/indexable-resource-fragments

streamx.blueprints.opensearch-sink.allowed-json-paths=\
took,\
timed_out,\
hits.max_score,\
hits.total..*,\
hits.hits.*['_id'],\
hits.hits.*['_score'],\
hits.hits.*['_source']..*,\
hits.hits.*.highlight..*,\
aggregations..*

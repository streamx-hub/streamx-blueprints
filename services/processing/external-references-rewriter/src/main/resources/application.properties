quarkus.otel.traces.exporter=none

mp.messaging.incoming.incoming-resources.connector=quarkus-http
mp.messaging.incoming.incoming-resources.deserializer=com.streamx.reactive.messaging.http.CloudEventJsonDeserializer
mp.messaging.incoming.incoming-resources.path=/incoming-resources

mp.messaging.incoming.incoming-configs.connector=quarkus-http
mp.messaging.incoming.incoming-configs.deserializer=com.streamx.reactive.messaging.http.CloudEventJsonDeserializer
mp.messaging.incoming.incoming-configs.path=/incoming-configs

mp.messaging.incoming.configs-state.connector=quarkus-http
mp.messaging.incoming.configs-state.deserializer=com.streamx.reactive.messaging.http.CloudEventJsonDeserializer
mp.messaging.incoming.configs-state.path=/configs-state

mp.messaging.outgoing.outgoing-resources.connector=quarkus-http
mp.messaging.outgoing.outgoing-resources.serializer=com.streamx.reactive.messaging.http.CloudEventJsonSerializer
mp.messaging.outgoing.outgoing-resources.url=${STREAMX_ENDPOINT_OUTGOING_RESOURCES}

mp.messaging.outgoing.download-requests.connector=quarkus-http
mp.messaging.outgoing.download-requests.serializer=com.streamx.reactive.messaging.http.CloudEventJsonSerializer
mp.messaging.outgoing.download-requests.url=${STREAMX_ENDPOINT_DOWNLOAD_REQUESTS}

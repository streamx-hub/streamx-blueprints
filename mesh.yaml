default:
  image:
    repository: ghcr.io/streamx-com/streamx-blueprints
    tag: latest-jvm

sources:
  resources-source:
    outgoing:
      - topic: "inboxes/pages"
        produces:
          - "com.streamx.blueprints.page.published.v1"
          - "com.streamx.blueprints.page.unpublished.v1"
      - topic: "inboxes/web-resources"
        produces:
          - "com.streamx.blueprints.web-resource.published.v1"
          - "com.streamx.blueprints.web-resource.unpublished.v1"
      - topic: "inboxes/assets"
        produces:
          - "com.streamx.blueprints.asset.published.v1"
          - "com.streamx.blueprints.asset.unpublished.v1"
      - topic: "inboxes/layouts"
        produces:
          - "com.streamx.blueprints.layout.published.v1"
          - "com.streamx.blueprints.layout.unpublished.v1"
      - topic: "inboxes/compositions"
        produces:
          - "com.streamx.blueprints.composition.published.v1"
          - "com.streamx.blueprints.composition.unpublished.v1"
      - topic: "inboxes/data"
        produces:
          - "com.streamx.blueprints.data.published.v1"
          - "com.streamx.blueprints.data.unpublished.v1"
      - topic: "inboxes/renderers"
        produces:
          - "com.streamx.blueprints.renderer.published.v1"
          - "com.streamx.blueprints.renderer.unpublished.v1"
      - topic: "inboxes/rendering-contexts"
        produces:
          - "com.streamx.blueprints.rendering-context.published.v1"
          - "com.streamx.blueprints.rendering-context.unpublished.v1"

descriptors:
  image-optimizer:
    type: "processing"
    incoming:
      incoming-assets:
        binding: "http-structured-json"
      incoming-pages:
        binding: "http-structured-json"
    outgoing:
      optimized-assets:
        binding: "http-structured-json"
      outgoing-pages:
        binding: "http-structured-json"

  json-aggregator:
    type: "processing"
    incoming:
      data:
        binding: "http-structured-json"
      multivalued-data:
        binding: "http-structured-json"
    outgoing:
      aggregated-data:
        binding: "http-structured-json"
      aggregated-multivalued-data:
        binding: "http-structured-json"

  external-references-rewriter:
    type: "processing"
    incoming:
      incoming-resources:
        binding: "http-structured-json"
    outgoing:
      outgoing-resources:
        binding: "http-structured-json"
      download-requests:
        binding: "http-structured-json"

  resource-downloader:
    type: "processing"
    incoming:
      download-requests:
        binding: "http-structured-json"
    outgoing:
      downloaded-pages:
        binding: "http-structured-json"
      downloaded-assets:
        binding: "http-structured-json"
      downloaded-web-resources:
        binding: "http-structured-json"

  rendering-engine:
    type: "processing"
    incoming:
      data:
        binding: "http-structured-json"
      renderers:
        binding: "http-structured-json"
      rendering-contexts:
        binding: "http-structured-json"
      incoming-rendering-requests:
        binding: "http-structured-json"
    outgoing:
      outgoing-rendering-requests:
        binding: "http-structured-json"
      pages:
        binding: "http-structured-json"
      fragments:
        binding: "http-structured-json"

  composition-engine:
    type: "processing"
    incoming:
      layouts:
        binding: "http-structured-json"
      compositions:
        binding: "http-structured-json"
      incoming-page-compose-requests:
        binding: "http-structured-json"
    outgoing:
      pages:
        binding: "http-structured-json"
      outgoing-page-compose-requests:
        binding: "http-structured-json"

  sitemap-generator:
    type: "processing"
    incoming:
      incoming-pages:
        binding: "http-structured-json"
    outgoing:
      outgoing-sitemaps:
        binding: "http-structured-json"

  indexable-resources-producer:
    type: "processing"
    incoming:
      pages:
        binding: "http-structured-json"
      fragments:
        binding: "http-structured-json"
    outgoing:
      indexable-resources:
        binding: "http-structured-json"
      indexable-resource-fragments:
        binding: "http-structured-json"

  web-server:
    type: "processing"
    incoming:
      resources:
        binding: "http-structured-json"

ingestion:
  rest-ingestion:
    containers:
    - environment:
        QUARKUS_HTTP_AUTH_PERMISSION_BEARER_POLICY: permit

processing:
  web-resources-relay:
    containers:
      - incoming:
          incoming-web-resources:
            topic: inboxes/web-resources
        outgoing:
          outgoing-web-resources:
            topic: relays/web-resources
        environment:
          STREAMX_PROXY_CONFIG_RELAY_ENABLED: "true"

  assets-relay:
    containers:
      - incoming:
          incoming-assets:
            topic: inboxes/assets
        outgoing:
          outgoing-assets:
            topic: outboxes/assets
        environment:
          STREAMX_PROXY_CONFIG_RELAY_ENABLED: "true"

  fragments-relay:
    containers:
      - incoming:
          incoming-fragments:
            topic: inboxes/fragments
        outgoing:
          outgoing-fragments:
            topic: relays/fragments
        environment:
          STREAMX_PROXY_CONFIG_RELAY_ENABLED: "true"

  outbox-fragments-relay:
    containers:
      - incoming:
          messages:
            topic: relays/fragments
        outgoing:
          relayed-messages:
            topic: outboxes/fragments
        environment:
          STREAMX_PROXY_CONFIG_RELAY_ENABLED: "true"

  blueprint-image-optimizer:
    containers:
    - image: image-optimizer
      incoming:
        incoming-assets:
          topic: inboxes/assets
        incoming-pages:
          topic: inboxes/pages
      outgoing:
        optimized-assets:
          topic: inboxes/assets
        outgoing-pages:
          topic: relays/pages
      environment:
        STREAMX_BLUEPRINTS_IMAGE_OPTIMIZER_OPTIMIZED_FILE_PATHS_PATTERN: ".*(png|gif|jpg|jpeg)$"
        STREAMX_BLUEPRINTS_IMAGE_OPTIMIZER_ADJUSTED_PAGE_PATHS_PATTERN: ".*"

  blueprint-json-aggregator:
    containers:
      - image: json-aggregator
        incoming:
          data:
            topic: inboxes/data
          multivalued-data:
            topic: inboxes/data
        outgoing:
          aggregated-data:
            topic: relays/aggregated-data
          aggregated-multivalued-data:
            topic: relays/data
        environment:
          STREAMX_BLUEPRINTS_JSON_AGGREGATOR_CONFIGURATIONS_0__MASTER_NAMESPACE: "pim"
          STREAMX_BLUEPRINTS_JSON_AGGREGATOR_CONFIGURATIONS_0__OPTIONAL_NAMESPACES: "price,reviews"
          STREAMX_BLUEPRINTS_JSON_AGGREGATOR_CONFIGURATIONS_0__OUTPUT_NAMESPACE: "product"
          STREAMX_BLUEPRINTS_JSON_AGGREGATOR_CONFIGURATIONS_1__MASTER_NAMESPACE: "review"
          STREAMX_BLUEPRINTS_JSON_AGGREGATOR_CONFIGURATIONS_1__OUTPUT_NAMESPACE: "reviews"
          STREAMX_BLUEPRINTS_JSON_AGGREGATOR_CONFIGURATIONS_2__MASTER_NAMESPACE: "default_product"
          STREAMX_BLUEPRINTS_JSON_AGGREGATOR_CONFIGURATIONS_2__OUTPUT_NAMESPACE: "product"
          STREAMX_BLUEPRINTS_JSON_AGGREGATOR_CONFIGURATIONS_3__MASTER_NAMESPACE: "default_category"
          STREAMX_BLUEPRINTS_JSON_AGGREGATOR_CONFIGURATIONS_3__OUTPUT_NAMESPACE: "category"

  # Instance 1 of external-references-rewriter: process web resources
  blueprint-web-resources-external-references-rewriter:
    containers:
    - image: external-references-rewriter
      incoming:
        incoming-resources:
          topic: relays/web-resources
      outgoing:
        outgoing-resources:
          topic: outboxes/web-resources
        download-requests:
          topic: relays/download-requests
      environment:
        STREAMX_BLUEPRINTS_EXTERNAL_REFERENCES_REWRITER_BASE_URL_FOR_RELATIVE_PATHS: "https://www.streamx.tech/"
        STREAMX_BLUEPRINTS_EXTERNAL_REFERENCES_REWRITER_PROCESSABLE_PAYLOAD_TYPES: "web-resource"
        STREAMX_BLUEPRINTS_EXTERNAL_REFERENCES_REWRITER_XML_EXTERNAL_RESOURCE_XPATH_SELECTORS: "/*[local-name()='urlset']/*[local-name()='url']/*[local-name()='loc']"
        STREAMX_BLUEPRINTS_EXTERNAL_REFERENCES_REWRITER_YAML_EXTERNAL_RESOURCE_JSONPATH_SELECTORS: "$.indices.*.target"
        STREAMX_BLUEPRINTS_EXTERNAL_REFERENCES_REWRITER_EMITTED_PAGE_TYPE: "page/external"
        STREAMX_BLUEPRINTS_EXTERNAL_REFERENCES_REWRITER_EMITTED_WEB_RESOURCE_TYPE: "web-resource/external"
        STREAMX_BLUEPRINTS_EXTERNAL_REFERENCES_REWRITER_EMITTED_ASSET_TYPE: "asset/external"

  # Instance 2 of external-references-rewriter: process pages
  blueprint-pages-external-references-rewriter:
    containers:
    - image: external-references-rewriter
      incoming:
        incoming-resources:
          topic: relays/pages
      outgoing:
        outgoing-resources:
          topic: outboxes/pages
        download-requests:
          topic: relays/download-requests
      environment:
        STREAMX_BLUEPRINTS_EXTERNAL_REFERENCES_REWRITER_BASE_URL_FOR_RELATIVE_PATHS: "https://www.streamx.tech/"
        STREAMX_BLUEPRINTS_EXTERNAL_REFERENCES_REWRITER_PROCESSABLE_PAYLOAD_TYPES: "page/external"
        STREAMX_BLUEPRINTS_EXTERNAL_REFERENCES_REWRITER_HTML_EXTERNAL_RESOURCE_XPATH_SELECTORS: "//img/@src,//link[@rel='stylesheet']/@href,//script/@src"
        STREAMX_BLUEPRINTS_EXTERNAL_REFERENCES_REWRITER_EMITTED_PAGE_TYPE: "page/external"
        STREAMX_BLUEPRINTS_EXTERNAL_REFERENCES_REWRITER_EMITTED_WEB_RESOURCE_TYPE: "web-resource/external"
        STREAMX_BLUEPRINTS_EXTERNAL_REFERENCES_REWRITER_EMITTED_ASSET_TYPE: "asset/external"

  blueprint-resource-downloader:
    containers:
    - image: resource-downloader
      incoming:
        download-requests:
          topic: relays/download-requests
      outgoing:
        downloaded-pages:
          topic: inboxes/pages
        downloaded-assets:
          topic: inboxes/assets
        downloaded-web-resources:
          topic: inboxes/web-resources

  blueprint-rendering-engine:
    containers:
      - image: rendering-engine
        incoming:
          data:
            topic: relays/aggregated-data
          renderers:
            topic: inboxes/renderers
          rendering-contexts:
            topic: inboxes/rendering-contexts
          incoming-rendering-requests:
            topic: relays/rendering-requests
        outgoing:
          outgoing-rendering-requests:
            topic: relays/rendering-requests
          pages:
            topic: relays/pages
          fragments:
            topic: relays/fragments

  blueprint-composition-engine:
    containers:
    - image: composition-engine
      incoming:
        layouts:
          topic: inboxes/layouts
        compositions:
          topic: inboxes/compositions
        incoming-page-compose-requests:
          topic: relays/page-compose-requests
      outgoing:
        pages:
          topic: relays/pages
        outgoing-page-compose-requests:
          topic: relays/page-compose-requests

  blueprint-sitemap-generator:
    containers:
      - image: sitemap-generator
        incoming:
          incoming-pages:
            topic: relays/pages
        outgoing:
          outgoing-sitemaps:
            topic: outboxes/web-resources
        environment:
          STREAMX_BLUEPRINTS_SITEMAP_GENERATOR_BASE_URL: "http://localhost:8081"
          STREAMX_BLUEPRINTS_SITEMAP_GENERATOR_OUTPUT_KEY: "sitemap.xml"
          STREAMX_BLUEPRINTS_SITEMAP_GENERATOR_DIRTY_CHECK_INTERVAL: "1s"
          STREAMX_BLUEPRINTS_SITEMAP_GENERATOR_DIRTY_CHECK_MAX_DIRTY_SEQUENCE_COUNT: "1"

  blueprint-indexable-resources-producer:
    containers:
      - image: indexable-resources-producer
        incoming:
          pages:
            topic: relays/pages
          fragments:
            topic: relays/fragments
        outgoing:
          indexable-resources:
            topic: outboxes/indexable-resources
          indexable-resource-fragments:
            topic: outboxes/indexable-resource-fragments
        environment:
          STREAMX_BLUEPRINTS_INDEXABLE_RESOURCES_PRODUCER_INDEX_FRAGMENTS: "true"

edge:
  blueprint-web-server:
    containers:
    - image: web-server
      incoming:
        resources:
          topic: outboxes/pages,outboxes/fragments,outboxes/assets,outboxes/web-resources
      ports:
      - "8081:8080"
      environment:
        STREAMX_DELIVERY_SERVICE_READINESS_CHECK_ENABLED: "false"
streamx.blueprints.data-collector.dirty-check.interval=1s
streamx.blueprints.data-collector.dirty-check.max-dirty-sequence-count=0
streamx.blueprints.data-collector.dirty-check.delay=1s

streamx.blueprints.data-collector.configurations.cheapest-products-by-category.data-key-match-pattern=product:.*
streamx.blueprints.data-collector.configurations.cheapest-products-by-category.collector=aggregate-by-property-value
streamx.blueprints.data-collector.configurations.cheapest-products-by-category.properties.outputkeyprefix=collected:products:cheapest-by-category:
streamx.blueprints.data-collector.configurations.cheapest-products-by-category.properties.groupby=categories/name
streamx.blueprints.data-collector.configurations.cheapest-products-by-category.properties.sortby=price/value
streamx.blueprints.data-collector.configurations.cheapest-products-by-category.properties.sortmode=asc
streamx.blueprints.data-collector.configurations.cheapest-products-by-category.properties.max=8
%case1.streamx.blueprints.data-collector.configurations.cheapest-products-by-category.properties.filterby=$[?(@.id == 'B072ZLCB3M')]
%case2.streamx.blueprints.data-collector.configurations.cheapest-products-by-category.properties.filterby=$.attributes[?(@.name == 'height' && @.value == '18.9')]
%case3.streamx.blueprints.data-collector.configurations.cheapest-products-by-category.properties.filterby=$.attributes[?(@.name == 'height' && @.value == '18.9')],$.categories[?(@.name == 'End Tables')]
%case4.streamx.blueprints.data-collector.configurations.cheapest-products-by-category.properties.filterby=$.categories[?(@.name == 'End Tables')]


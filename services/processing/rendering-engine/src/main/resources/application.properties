mp.messaging.incoming.rendering-contexts-state.connector=quarkus-websocket
mp.messaging.incoming.rendering-contexts-state.message-id-provider=com.streamx.blueprints.cloudevents.utils.CloudEventMessageIdProvider
mp.messaging.incoming.rendering-contexts-state.deserializer=com.streamx.reactive.messaging.http.CloudEventJsonDeserializer

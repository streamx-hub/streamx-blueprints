streamx.blueprints.indexable-resources-producer.index-fragments=true
streamx.blueprints.indexable-resources-producer.include-facets=true
streamx.blueprints.indexable-resources-producer.include-fields=true

streamx.blueprints.indexable-resources-producer.facets-configuration.eds.selector=meta[property^=facets:]
streamx.blueprints.indexable-resources-producer.facets-configuration.eds.keys=property
streamx.blueprints.indexable-resources-producer.facets-configuration.eds.key-delimiter=facets:
streamx.blueprints.indexable-resources-producer.facets-configuration.eds.values=content

streamx.blueprints.indexable-resources-producer.facets-configuration.color.single-attr=true
streamx.blueprints.indexable-resources-producer.facets-configuration.color.selector=div.test
streamx.blueprints.indexable-resources-producer.facets-configuration.color.keys=color

streamx.blueprints.indexable-resources-producer.facets-configuration.nested.selector=meta[name^=facets:]
streamx.blueprints.indexable-resources-producer.facets-configuration.nested.keys=name
streamx.blueprints.indexable-resources-producer.facets-configuration.nested.key-delimiter=facets:
streamx.blueprints.indexable-resources-producer.facets-configuration.nested.values=value
streamx.blueprints.indexable-resources-producer.facets-configuration.nested.hierarchical-facet-delimiter=>

streamx.blueprints.indexable-resources-producer.fields-configuration.fields.selector=meta[property]
streamx.blueprints.indexable-resources-producer.fields-configuration.fields.keys=property
streamx.blueprints.indexable-resources-producer.fields-configuration.fields.values=content
streamx.blueprints.indexable-resources-producer.fields-configuration.fields.allowed-key-values=description,image,date

mp.messaging.incoming.pages.connector=smallrye-in-memory
mp.messaging.incoming.fragments.connector=smallrye-in-memory
mp.messaging.outgoing.indexable-resources.connector=smallrye-in-memory
mp.messaging.outgoing.indexable-resource-fragments.connector=smallrye-in-memory

quarkus.wiremock.devservices.enabled=false
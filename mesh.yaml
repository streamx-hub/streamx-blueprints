defaultRegistry: ghcr.io/streamx-com/streamx-blueprints
defaultImageTag: latest-jvm

sources:
  resources-source:
    outgoing:
      - topic: "inboxes/resources"
        produces:
          - "com.streamx.blueprints.page.published.v1"
          - "com.streamx.blueprints.page.unpublished.v1"
          - "com.streamx.blueprints.web-resource.published.v1"
          - "com.streamx.blueprints.web-resource.unpublished.v1"
      - topic: "inboxes/layouts"
        produces:
          - "com.streamx.blueprints.layout.published.v1"
          - "com.streamx.blueprints.layout.unpublished.v1"
      - topic: "inboxes/compositions"
        produces:
          - "com.streamx.blueprints.composition.published.v1"
          - "com.streamx.blueprints.composition.unpublished.v1"

descriptors:
  external-resources-processing-service:
    type: "processing"
    incoming:
      incoming-resources:
        binding: "http-structured-json"
    outgoing:
      outgoing-resources:
        binding: "http-structured-json"
      download-requests:
        binding: "http-structured-json"

  resource-downloader-processing-service:
    type: "processing"
    incoming:
      download-requests:
        binding: "http-structured-json"
    outgoing:
      downloaded-resources:
        binding: "http-structured-json"

  composition-engine-processing-service:
    type: "processing"
    incoming:
      layouts:
        binding: "http-structured-json"
      compositions:
        binding: "http-structured-json"
      incoming-page-compose-requests:
        binding: "http-structured-json"
    outgoing:
      pages:
        binding: "http-structured-json"
      outgoing-page-compose-requests:
        binding: "http-structured-json"

  web-delivery-service:
    type: "processing"
    incoming:
      resources:
        binding: "http-structured-json"

ingestion:
  rest-ingestion:
    environment:
      QUARKUS_HTTP_AUTH_PERMISSION_BEARER_POLICY: permit

processing:
  # Instance 1 of external-resources service: process web resources
  blueprint-web-resources-external-resources-processor:
    image: external-resources-processing-service
    incoming:
      incoming-resources:
        topic: inboxes/resources
    outgoing:
      outgoing-resources:
        topic: relays/resources
      download-requests:
        topic: relays/download-requests
    environment:
      STREAMX_BLUEPRINTS_EXTERNAL_RESOURCES_PROCESSING_SERVICE_BASE_URL_FOR_RELATIVE_PATHS: "https://www.streamx.dev/"
      STREAMX_BLUEPRINTS_EXTERNAL_RESOURCES_PROCESSING_SERVICE_PROCESSABLE_PAYLOAD_TYPES: "web-resource"
      STREAMX_BLUEPRINTS_EXTERNAL_RESOURCES_PROCESSING_SERVICE_XML_EXTERNAL_RESOURCE_XPATH_SELECTORS: "/*[local-name()='urlset']/*[local-name()='url']/*[local-name()='loc']"
      STREAMX_BLUEPRINTS_EXTERNAL_RESOURCES_PROCESSING_SERVICE_EMITTED_PAGE_TYPE: "page/external"
      STREAMX_BLUEPRINTS_EXTERNAL_RESOURCES_PROCESSING_SERVICE_EMITTED_WEB_RESOURCE_TYPE: "web-resource/external"
      STREAMX_BLUEPRINTS_EXTERNAL_RESOURCES_PROCESSING_SERVICE_EMITTED_ASSET_TYPE: "asset/external"

  # Instance 2 of external-resources service: process pages
  blueprint-pages-external-resources-processor:
    image: external-resources-processing-service
    incoming:
      incoming-resources:
        topic: relays/resources
    outgoing:
      outgoing-resources:
        topic: outboxes/resources
      download-requests:
        topic: relays/download-requests
    environment:
      STREAMX_BLUEPRINTS_EXTERNAL_RESOURCES_PROCESSING_SERVICE_BASE_URL_FOR_RELATIVE_PATHS: "https://www.streamx.dev/"
      STREAMX_BLUEPRINTS_EXTERNAL_RESOURCES_PROCESSING_SERVICE_PROCESSABLE_PAYLOAD_TYPES: "page/external"
      STREAMX_BLUEPRINTS_EXTERNAL_RESOURCES_PROCESSING_SERVICE_HTML_EXTERNAL_RESOURCE_XPATH_SELECTORS: "//img/@src,//link[@rel='stylesheet']/@href,//script/@src"
      STREAMX_BLUEPRINTS_EXTERNAL_RESOURCES_PROCESSING_SERVICE_EMITTED_PAGE_TYPE: "page/external"
      STREAMX_BLUEPRINTS_EXTERNAL_RESOURCES_PROCESSING_SERVICE_EMITTED_WEB_RESOURCE_TYPE: "web-resource/external"
      STREAMX_BLUEPRINTS_EXTERNAL_RESOURCES_PROCESSING_SERVICE_EMITTED_ASSET_TYPE: "asset/external"

  blueprint-resource-downloader:
    image: resource-downloader-processing-service
    incoming:
      download-requests:
        topic: relays/download-requests
    outgoing:
      downloaded-resources:
        topic: inboxes/resources

  blueprint-composition-engine:
    image: composition-engine-processing-service
    incoming:
      layouts:
        topic: inboxes/layouts
      compositions:
        topic: inboxes/compositions
      incoming-page-compose-requests:
        topic: relays/page-compose-requests
    outgoing:
      pages:
        topic: relays/resources
      outgoing-page-compose-requests:
        topic: relays/page-compose-requests

delivery:
  blueprint-web:
    image: web-delivery-service
    incoming:
      resources:
        topic: outboxes/resources
    port: 8081
    environment:
      STREAMX_DELIVERY_SERVICE_READINESS_CHECK_ENABLED: "false"
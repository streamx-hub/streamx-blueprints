name: 'Release: Maven and Docker Artifacts'

on:
  workflow_dispatch:

permissions:
  id-token: write
  packages: write
  contents: read

jobs:
  release-perform-amd64:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.GCP_STREAMX_RELEASES_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_STREAMX_RELEASES_RELEASE_DEPLOY_SA }}
          token_format: access_token

      - name: Login to GAR
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.GAR_DOCKER_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Log in to the GH Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.email "github.actions@streamx.dev"
          git config --global user.name "${GITHUB_ACTOR}"
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_SECRET_KEY }}" > ~/.ssh/id_rsa
          chmod 0600 ~/.ssh/id_rsa

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'adopt'

      - name: Release prepare
        id: prepare-release
        run: |
          ./mvnw -B release:prepare

      - name: Extract release tag
        id: set-tag
        run: |
          TAG=$(git describe --tags --abbrev=0)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Release perform
        run: |
          ARGS="-DskipTests \
            -Dnative \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.additional-tags=${{ steps.set-tag.outputs.tag }}-amd64 \
            -Dquarkus.docker.buildx.platform=linux/amd64"
          ./mvnw -B release:perform -P release -Darguments="$ARGS"

  release-build-arm64-from-tag:
    runs-on: ubuntu-latest-m-arm
    needs: release-perform-amd64
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-perform-amd64.outputs.release_tag }}

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.GCP_STREAMX_RELEASES_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_STREAMX_RELEASES_RELEASE_DEPLOY_SA }}
          token_format: access_token

      - name: Login to GAR
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.GAR_DOCKER_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Log in to the GH Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'adopt'

      - name: Build arm64 image from tag
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          ./mvnw -DskipTests -B package \
            -Dnative \
            -P release \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.additional-tags=$VERSION-arm64 \
            -Dquarkus.docker.buildx.platform=linux/arm64

      - name: Create and push multi-arch manifests for modules with native container build
        shell: bash
        env:
          TAG: ${{ needs.release-perform-amd64.outputs.release_tag }}
        run: |
          set -euo pipefail
          set -x  # print each command for debugging
          
          MODULES=$(./mvnw -q --also-make exec:exec -Dexec.executable="pwd")
          
          for module in $MODULES; do
            if [ "$(./mvnw -Prelease -Dnative -q -f "$module/pom.xml" help:evaluate -Dexpression=quarkus.native.container-build -DforceStdout)" = "true" ]; then
              echo "Processing module: $module"
          
              REGISTRY=$(./mvnw -f "$module/pom.xml" help:evaluate -Dexpression=quarkus.container-image.registry -q -DforceStdout -Dnative -P release)
              GROUP=$(./mvnw -f "$module/pom.xml" help:evaluate -Dexpression=quarkus.container-image.group -q -DforceStdout -Dnative -P release)
              IMAGE_NAME=$(./mvnw -f "$module/pom.xml" help:evaluate -Dexpression=quarkus.container-image.name -q -DforceStdout -Dnative -P release)
              IMAGE_TYPE=$(./mvnw -f "$module/pom.xml" help:evaluate -Dexpression=streamx.container-image.package.type.native -q -DforceStdout -Dnative -P release)
          
              FULL_IMAGE_NAME="$REGISTRY/$GROUP/$IMAGE_NAME"

              echo "=== Creating manifest for $FULL_IMAGE_NAME:$TAG-$IMAGE_TYPE ==="
              if ! docker manifest create "$FULL_IMAGE_NAME:$TAG-$IMAGE_TYPE" \
                  --amend "$FULL_IMAGE_NAME:${TAG}-amd64" \
                  --amend "$FULL_IMAGE_NAME:${TAG}-arm64" 2>&1 | tee manifest_create_${IMAGE_NAME}_${IMAGE_TYPE}.log; then
                echo "Failed to create manifest for $FULL_IMAGE_NAME:$TAG-$IMAGE_TYPE"
                exit 1
              fi

              echo "=== Pushing manifest $FULL_IMAGE_NAME:$TAG-$IMAGE_TYPE ==="
              if ! docker manifest push "$FULL_IMAGE_NAME:$TAG-$IMAGE_TYPE" 2>&1 | tee manifest_push_${IMAGE_NAME}_${IMAGE_TYPE}.log; then
                echo "Failed to push manifest for $FULL_IMAGE_NAME:$TAG-$IMAGE_TYPE"
                exit 1
              fi

              echo "=== Creating manifest for $FULL_IMAGE_NAME:latest-$IMAGE_TYPE ==="
              if ! docker manifest create "$FULL_IMAGE_NAME:latest-$IMAGE_TYPE" \
                  --amend "$FULL_IMAGE_NAME:${TAG}-amd64" \
                  --amend "$FULL_IMAGE_NAME:${TAG}-arm64" 2>&1 | tee manifest_create_latest_${IMAGE_NAME}_${IMAGE_TYPE}.log; then
                echo "Failed to create manifest for $FULL_IMAGE_NAME:latest-$IMAGE_TYPE"
                exit 1
              fi

              echo "=== Pushing manifest $FULL_IMAGE_NAME:latest-$IMAGE_TYPE ==="
              if ! docker manifest push "$FULL_IMAGE_NAME:latest-$IMAGE_TYPE" 2>&1 | tee manifest_push_latest_${IMAGE_NAME}_${IMAGE_TYPE}.log; then
                echo "Failed to push manifest for $FULL_IMAGE_NAME:latest-$IMAGE_TYPE"
                exit 1
              fi

              echo "Successfully processed module: $module"
            fi
          done

          echo "All manifests created and pushed successfully!"
streamx.blueprints.sitemap-generator.generate-lastmod-attribute=false
streamx.blueprints.sitemap-generator.dirty-check.interval=5s
streamx.blueprints.sitemap-generator.dirty-check.delay=10s
streamx.blueprints.sitemap-generator.dirty-check.max-dirty-sequence-count=12

mp.messaging.incoming.incoming-pages.connector=quarkus-http
mp.messaging.incoming.incoming-pages.deserializer=com.streamx.reactive.messaging.http.CloudEventJsonDeserializer
mp.messaging.incoming.incoming-pages.path=/incoming-pages

mp.messaging.outgoing.outgoing-sitemaps.connector=quarkus-http
mp.messaging.outgoing.outgoing-sitemaps.serializer=com.streamx.reactive.messaging.http.CloudEventJsonSerializer
mp.messaging.outgoing.outgoing-sitemaps.url=${STREAMX_ENDPOINT_OUTGOING_SITEMAPS}

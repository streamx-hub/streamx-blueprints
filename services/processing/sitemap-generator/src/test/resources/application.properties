streamx.blueprints.sitemap-generator.base-url=https://test-domain.com
streamx.blueprints.sitemap-generator.match-key-patterns.pattern1=/*.html

streamx.blueprints.sitemap-generator.output-key=sitemap.xml
streamx.blueprints.sitemap-generator.output-type=sitemap-type
streamx.blueprints.sitemap-generator.generate-lastmod-attribute=true

streamx.blueprints.sitemap-generator.dirty-check.interval=5s
streamx.blueprints.sitemap-generator.dirty-check.delay=0s
streamx.blueprints.sitemap-generator.dirty-check.max-dirty-sequence-count=12

mp.messaging.incoming.incoming-pages.connector=smallrye-in-memory
mp.messaging.incoming.incoming-pages-state.connector=smallrye-in-memory
mp.messaging.outgoing.outgoing-sitemaps.connector=smallrye-in-memory

quarkus.scheduler.enabled=false
quarkus.wiremock.devservices.enabled=false
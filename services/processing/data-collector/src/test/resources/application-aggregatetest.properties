streamx.blueprints.data-collector.dirty-check.interval=1s
streamx.blueprints.data-collector.dirty-check.max-dirty-sequence-count=0
streamx.blueprints.data-collector.dirty-check.delay=1s

streamx.blueprints.data-collector.configurations.cheapest-products-by-category.data-key-match-pattern=product:.*
streamx.blueprints.data-collector.configurations.cheapest-products-by-category.collector=aggregate-by-property-value
streamx.blueprints.data-collector.configurations.cheapest-products-by-category.properties.output-key-prefix=collected:products:cheapest-by-category:
streamx.blueprints.data-collector.configurations.cheapest-products-by-category.properties.group-by=categories/name
streamx.blueprints.data-collector.configurations.cheapest-products-by-category.properties.sort-by=price/value
streamx.blueprints.data-collector.configurations.cheapest-products-by-category.properties.sort-mode=asc
streamx.blueprints.data-collector.configurations.cheapest-products-by-category.properties.max=8
%case1.streamx.blueprints.data-collector.configurations.cheapest-products-by-category.properties.filter-by=$[?(@.id == 'B072ZLCB3M')]
%case2.streamx.blueprints.data-collector.configurations.cheapest-products-by-category.properties.filter-by=$.attributes[?(@.name == 'height' && @.value == '18.9')]
%case3.streamx.blueprints.data-collector.configurations.cheapest-products-by-category.properties.filter-by=$.attributes[?(@.name == 'height' && @.value == '18.9')],$.categories[?(@.name == 'End Tables')]
%case4.streamx.blueprints.data-collector.configurations.cheapest-products-by-category.properties.filter-by=$.categories[?(@.name == 'End Tables')]


quarkus.http.test-port=0

quarkus.pulsar.devservices.enabled=false
quasar.messaging.store.data_store-data.use-connector=false
mp.messaging.incoming.data.connector=smallrye-in-memory
mp.messaging.outgoing.web-resources.connector=smallrye-in-memory
mp.messaging.outgoing.collected-data.connector=smallrye-in-memory
streamx.blueprints.data-collector.dirty-check.interval=1s
streamx.blueprints.data-collector.dirty-check.max-dirty-sequence-count=0
streamx.blueprints.data-collector.dirty-check.delay=1s

streamx.blueprints.data-collector.configurations.test-collection.data-key-match-pattern=test-key:.*
streamx.blueprints.data-collector.configurations.test-collection.data-type-match-pattern=test-type:.*
streamx.blueprints.data-collector.configurations.test-collection.collector=test-collector
streamx.blueprints.data-collector.configurations.test-collection.properties.test-prop1=test-prop1-value
streamx.blueprints.data-collector.configurations.test-collection.properties.test-prop2=test-prop2-value
%outputtypetest.streamx.blueprints.data-collector.configurations.test-collection.output-data-type=configured-output-data-type
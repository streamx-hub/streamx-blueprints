mp.messaging.incoming.incoming-pages.connector=smallrye-in-memory
mp.messaging.incoming.incoming-web-resources.connector=smallrye-in-memory
mp.messaging.incoming.incoming-data.connector=smallrye-in-memory

mp.messaging.outgoing.outgoing-pages.connector=smallrye-in-memory
mp.messaging.outgoing.outgoing-web-resources.connector=smallrye-in-memory
mp.messaging.outgoing.outgoing-data.connector=smallrye-in-memory
mp.messaging.outgoing.outgoing-assets.connector=smallrye-in-memory

quarkus.http.test-port=0
quarkus.pulsar.devservices.enabled=false

streamx.blueprints.external-resources-processing-service.base-url-for-relative-paths=https://www.my-eds-server.com/
streamx.blueprints.external-resources-processing-service.processable-sx-types=page/blog,page/blog/external,web-resource/static,product/simple
streamx.blueprints.external-resources-processing-service.html-external-resource-xpath-selectors=//img/@src,//link[@rel='stylesheet']/@href,//script/@src,//picture/source/@srcset
streamx.blueprints.external-resources-processing-service.html-external-resource-url-exclusions-pattern=.*/(blocks/|fonts/|icons/|scripts/|styles/|helix-query.yaml).*
streamx.blueprints.external-resources-processing-service.xml-external-resource-xpath-selectors=/*[local-name()='urlset']/*[local-name()='url']/*[local-name()='loc']
streamx.blueprints.external-resources-processing-service.json-external-resource-jsonpath-selectors=$.data[*].image
streamx.blueprints.external-resources-processing-service.external-page-publish-sx-type=page/blog/external
streamx.blueprints.external-resources-processing-service.external-web-resource-publish-sx-type=web-resource/static/external
streamx.blueprints.external-resources-processing-service.external-resource-download-timeout-milliseconds=5000

quarkus.log.category."dev.streamx.blueprints.externalresources".level=trace
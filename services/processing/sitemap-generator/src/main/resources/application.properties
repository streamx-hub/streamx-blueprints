streamx.blueprints.sitemap-generator.generate-lastmod-attribute=false
streamx.blueprints.sitemap-generator.dirty-check.interval=5s
streamx.blueprints.sitemap-generator.dirty-check.delay=10s
streamx.blueprints.sitemap-generator.dirty-check.max-dirty-sequence-count=12

%dev.streamx.blueprints.sitemap-generator.output-key=sitemap.xml
%dev.streamx.blueprints.sitemap-generator.base-url=http://localhost:8081

%dev.mp.messaging.incoming.incoming-pages.topic=persistent://streamx/inboxes/pages
%dev.mp.messaging.outgoing.outgoing-sitemaps.topic=persistent://streamx/outboxes/web-resources

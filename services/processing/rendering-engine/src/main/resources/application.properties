mp.messaging.incoming.renderers.connector=quarkus-websocket
mp.messaging.incoming.renderers.message-id-provider=com.streamx.blueprints.cloudevents.utils.CloudEventMessageIdProvider
mp.messaging.incoming.renderers.deserializer=com.streamx.reactive.messaging.http.CloudEventJsonDeserializer
mp.messaging.incoming.renderers.path=/renderers

mp.messaging.incoming.renderers-state.connector=quarkus-websocket
mp.messaging.incoming.renderers-state.message-id-provider=com.streamx.blueprints.cloudevents.utils.CloudEventMessageIdProvider
mp.messaging.incoming.renderers-state.deserializer=com.streamx.reactive.messaging.http.CloudEventJsonDeserializer

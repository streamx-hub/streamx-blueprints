quarkus.otel.traces.exporter=none

mp.messaging.incoming.data.subscriptionName=json-aggregator-data
mp.messaging.incoming.multivalued-data.subscriptionName=json-aggregator-multivalued-data

mp.messaging.incoming.data.connector=quarkus-websocket
mp.messaging.incoming.data.message-id-provider=com.streamx.blueprints.cloudevents.utils.CloudEventMessageIdProvider
mp.messaging.incoming.data.deserializer=com.streamx.reactive.messaging.http.CloudEventJsonDeserializer
mp.messaging.incoming.data.path=/data

mp.messaging.incoming.data-state.connector=quarkus-websocket
mp.messaging.incoming.data-state.message-id-provider=com.streamx.blueprints.cloudevents.utils.CloudEventMessageIdProvider
mp.messaging.incoming.data-state.deserializer=com.streamx.reactive.messaging.http.CloudEventJsonDeserializer
mp.messaging.incoming.data-state.path=/data-state

mp.messaging.incoming.multivalued-data.connector=quarkus-websocket
mp.messaging.incoming.multivalued-data.message-id-provider=com.streamx.blueprints.cloudevents.utils.CloudEventMessageIdProvider
mp.messaging.incoming.multivalued-data.deserializer=com.streamx.reactive.messaging.http.CloudEventJsonDeserializer
mp.messaging.incoming.multivalued-data.path=/multivalued-data

mp.messaging.incoming.multivalued-data-state.connector=quarkus-websocket
mp.messaging.incoming.multivalued-data-state.message-id-provider=com.streamx.blueprints.cloudevents.utils.CloudEventMessageIdProvider
mp.messaging.incoming.multivalued-data-state.deserializer=com.streamx.reactive.messaging.http.CloudEventJsonDeserializer
mp.messaging.incoming.multivalued-data-state.path=/multivalued-data-state

mp.messaging.outgoing.aggregated-data.connector=quarkus-websocket
mp.messaging.outgoing.aggregated-data.message-id-provider=com.streamx.blueprints.cloudevents.utils.CloudEventMessageIdProvider
mp.messaging.outgoing.aggregated-data.serializer=com.streamx.reactive.messaging.http.CloudEventJsonSerializer
mp.messaging.outgoing.aggregated-data.url=${STREAMX_ENDPOINT_AGGREGATED_DATA}

mp.messaging.outgoing.aggregated-multivalued-data.connector=quarkus-websocket
mp.messaging.outgoing.aggregated-multivalued-data.message-id-provider=com.streamx.blueprints.cloudevents.utils.CloudEventMessageIdProvider
mp.messaging.outgoing.aggregated-multivalued-data.serializer=com.streamx.reactive.messaging.http.CloudEventJsonSerializer
mp.messaging.outgoing.aggregated-multivalued-data.url=${STREAMX_ENDPOINT_AGGREGATED_MULTIVALUED_DATA}

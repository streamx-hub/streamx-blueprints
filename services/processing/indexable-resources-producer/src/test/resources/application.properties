streamx.blueprints.indexable-resources-producer.index-fragments=true
streamx.blueprints.indexable-resources-producer.include-facets=true

streamx.blueprints.indexable-resources-producer.configurations.eds.selector=meta[property^=facets:]
streamx.blueprints.indexable-resources-producer.configurations.eds.keys=property
streamx.blueprints.indexable-resources-producer.configurations.eds.key-delimiter=facets:
streamx.blueprints.indexable-resources-producer.configurations.eds.values=content

streamx.blueprints.indexable-resources-producer.configurations.color.single-attr=true
streamx.blueprints.indexable-resources-producer.configurations.color.selector=div.test
streamx.blueprints.indexable-resources-producer.configurations.color.keys=color

mp.messaging.incoming.pages.connector=smallrye-in-memory
mp.messaging.incoming.fragments.connector=smallrye-in-memory
mp.messaging.outgoing.indexable-resources.connector=smallrye-in-memory
mp.messaging.outgoing.indexable-resource-fragments.connector=smallrye-in-memory

quarkus.wiremock.devservices.enabled=false
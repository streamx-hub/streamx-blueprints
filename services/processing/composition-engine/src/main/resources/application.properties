# Both Layout and Composition processing may produce PageComposeRequests
mp.messaging.outgoing.outgoing-page-compose-requests.merge=true

mp.messaging.incoming.layouts.connector=quarkus-http
mp.messaging.incoming.layouts.deserializer=dev.streamx.reactive.messaging.http.CloudEventJsonDeserializer
mp.messaging.incoming.layouts.path=/layouts

mp.messaging.incoming.compositions.connector=quarkus-http
mp.messaging.incoming.compositions.deserializer=dev.streamx.reactive.messaging.http.CloudEventJsonDeserializer
mp.messaging.incoming.compositions.path=/compositions

mp.messaging.outgoing.pages.connector=quarkus-http
mp.messaging.outgoing.pages.serializer=dev.streamx.reactive.messaging.http.CloudEventJsonSerializer

mp.messaging.incoming.incoming-page-compose-requests.connector=quarkus-http
mp.messaging.incoming.incoming-page-compose-requests.deserializer=dev.streamx.reactive.messaging.http.CloudEventJsonDeserializer
mp.messaging.incoming.incoming-page-compose-requests.path=/incoming-page-compose-requests

mp.messaging.outgoing.outgoing-page-compose-requests.connector=quarkus-http
mp.messaging.outgoing.outgoing-page-compose-requests.serializer=dev.streamx.reactive.messaging.http.CloudEventJsonSerializer
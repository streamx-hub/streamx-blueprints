mp.messaging.incoming.download-requests.connector=smallrye-in-memory
mp.messaging.outgoing.downloaded-resources.connector=smallrye-in-memory

quarkus.http.test-port=0

streamx.blueprints.resource-downloader.head-timeout-milliseconds=1500
streamx.blueprints.resource-downloader.download-timeout-milliseconds=5000
%repeating-test-download.streamx.blueprints.resource-downloader.url-repeating-pattern=^.*/repeating-test-.*\\.json
%repeating-test-download.streamx.blueprints.resource-downloader.repeat-interval-millis=200
%repeating-test-download.streamx.blueprints.scheduled-resource.mock=enable
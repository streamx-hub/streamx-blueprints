quarkus.otel.traces.exporter=none

mp.messaging.incoming.resources.connector=quarkus-websocket
mp.messaging.incoming.resources.message-id-provider=com.streamx.blueprints.cloudevents.utils.CloudEventMessageIdProvider
mp.messaging.incoming.resources.deserializer=com.streamx.reactive.messaging.http.CloudEventJsonDeserializer
mp.messaging.incoming.resources.path=/resources

mp.messaging.outgoing.indexable-resources.connector=quarkus-websocket
mp.messaging.outgoing.indexable-resources.message-id-provider=com.streamx.blueprints.cloudevents.utils.CloudEventMessageIdProvider
mp.messaging.outgoing.indexable-resources.serializer=com.streamx.reactive.messaging.http.CloudEventJsonSerializer
mp.messaging.outgoing.indexable-resources.url=${STREAMX_ENDPOINT_INDEXABLE_RESOURCES}